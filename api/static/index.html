<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NARIT Legal Graph — Incident Analysis</title>
  <style>
    :root {
      --bg: #0b0f19;
      --panel-bg: #151c2c;
      --card-bg: #1c263c;
      --border: #2d3b55;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --accent: #10b981;
      --tag-bg: #1e3a5f;
      --tag-text: #93c5fd;
      --radius: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 20px 32px;
      border-bottom: 1px solid var(--border);
      background-color: var(--panel-bg);
    }

    header h1 {
      font-size: 1.4rem;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.02em;
    }

    header p {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 28px;
      padding: 32px;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    @media (max-width: 860px) {
      main {
        grid-template-columns: 1fr;
        padding: 20px;
      }
    }

    .panel {
      background-color: var(--panel-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      display: flex;
      flex-direction: column;
    }

    .panel-title {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      flex: 1;
      gap: 12px;
    }

    label {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--text-muted);
    }

    textarea {
      flex: 1;
      min-height: 240px;
      background-color: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: inherit;
      font-size: 0.95rem;
      line-height: 1.5;
      padding: 16px;
      resize: vertical;
      outline: none;
      transition: border-color 0.2s;
    }

    textarea:focus {
      border-color: var(--primary);
    }

    button {
      background-color: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: var(--radius);
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 12px 24px;
      cursor: pointer;
      transition: background-color 0.2s, opacity 0.2s;
      margin-top: 12px;
    }

    button:hover:not(:disabled) {
      background-color: var(--primary-hover);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .results-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
      flex: 1;
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      min-height: 240px;
      color: var(--text-muted);
      font-size: 0.95rem;
      text-align: center;
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      padding: 24px;
    }

    .section-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .code-badge {
      display: inline-block;
      background-color: var(--tag-bg);
      color: var(--tag-text);
      font-size: 0.8rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 4px;
      letter-spacing: 0.03em;
    }

    .section-title {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--text);
    }

    .section-text {
      font-size: 0.9rem;
      line-height: 1.6;
      color: #cbd5e1;
      white-space: pre-wrap;
    }

    details {
      margin-top: 6px;
      border-top: 1px solid var(--border);
      padding-top: 10px;
    }

    summary {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--tag-text);
      cursor: pointer;
      user-select: none;
      outline: none;
    }

    summary:hover {
      text-decoration: underline;
    }

    .path-list {
      list-style: none;
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .path-step {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.825rem;
      background-color: var(--bg);
      border: 1px solid var(--border);
      padding: 6px 10px;
      border-radius: 4px;
      color: #e2e8f0;
    }

    .path-step.keyword {
      color: #60a5fa;
    }

    .path-step.statute {
      color: #34d399;
    }

    .error-msg {
      color: #f87171;
      font-size: 0.9rem;
      padding: 12px;
      background-color: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.2);
      border-radius: var(--radius);
    }
  </style>
</head>
<body>
  <header>
    <h1>NARIT Legal Graph</h1>
    <p>Indian Criminal Law Statute Reasoning & Knowledge Graph Engine</p>
  </header>

  <main>
    <!-- Left Panel: Input -->
    <section class="panel">
      <h2 class="panel-title">Incident Facts</h2>
      <div class="form-group">
        <label for="facts-input">Enter facts or FIR narrative:</label>
        <textarea id="facts-input" placeholder="Someone stole my motorcycle from outside my house last night...">Someone stole my motorcycle</textarea>
        <button id="analyze-btn">Analyze</button>
      </div>
    </section>

    <!-- Right Panel: Results -->
    <section class="panel">
      <h2 class="panel-title">Analysis & Legal Traversal</h2>
      <div id="results" class="results-container">
        <div class="empty-state">
          Enter incident facts and click <strong>Analyze</strong> to explore applicable statutes.
        </div>
      </div>
    </section>
  </main>

  <script>
    const factsInput = document.getElementById('facts-input');
    const analyzeBtn = document.getElementById('analyze-btn');
    const resultsContainer = document.getElementById('results');

    async function runAnalyze(facts) {
      const res = await fetch('/analyze', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ facts })
      });
      if (!res.ok) {
        throw new Error(`Server returned status ${res.status}`);
      }
      const data = await res.json();
      const panel = document.getElementById('results') || document.getElementById('right-panel');

      if (data.status === 'no_match' || !data.sections || data.sections.length === 0) {
        panel.innerHTML =
          '<div class="empty-state" style="padding:2rem;text-align:center;color:#94a3b8;">' +
          '<p style="font-size:1.05rem;">No specific legal sections found. ' +
          'Please provide more details about the incident.</p></div>';
        return;
      }

      // ... existing success render path unchanged ...
      renderSections(data.sections, data.path);
    }

    async function analyzeFacts() {
      const facts = factsInput.value.trim();
      if (!facts) return;

      analyzeBtn.disabled = true;
      analyzeBtn.textContent = 'Analyzing...';
      resultsContainer.innerHTML = '<div class="empty-state">Querying knowledge graph and traversing statutes...</div>';

      try {
        await runAnalyze(facts);
      } catch (err) {
        resultsContainer.innerHTML = `<div class="error-msg">Error analyzing facts: ${err.message}</div>`;
      } finally {
        analyzeBtn.disabled = false;
        analyzeBtn.textContent = 'Analyze';
      }
    }

    function renderSections(sections, path) {
      const panel = document.getElementById('results') || document.getElementById('right-panel');
      panel.innerHTML = '';

      sections.forEach(sec => {
        const card = document.createElement('div');
        card.className = 'section-card';

        const header = document.createElement('div');
        header.className = 'card-header';

        const badge = document.createElement('span');
        badge.className = 'code-badge';
        badge.textContent = sec.id ? sec.id.replace('_', ' ') : `${sec.code || ''} Section ${sec.number || ''}`.trim();

        const title = document.createElement('div');
        title.className = 'section-title';
        title.textContent = sec.title;

        header.appendChild(badge);
        header.appendChild(title);
        card.appendChild(header);

        if (sec.text) {
          const text = document.createElement('p');
          text.className = 'section-text';
          text.textContent = sec.text;
          card.appendChild(text);
        }

        if (path && path.length > 0) {
          const details = document.createElement('details');
          details.open = true;

          const summary = document.createElement('summary');
          summary.textContent = `Traversal Path (${path.length} steps)`;
          details.appendChild(summary);

          const list = document.createElement('ul');
          list.className = 'path-list';

          path.forEach(step => {
            const li = document.createElement('li');
            li.className = 'path-step';
            if (typeof step === 'string' && step.startsWith('Keyword:')) {
              li.classList.add('keyword');
            } else if (typeof step === 'string' && step.includes('Statute:')) {
              li.classList.add('statute');
            }
            li.textContent = step;
            list.appendChild(li);
          });

          details.appendChild(list);
          card.appendChild(details);
        }

        panel.appendChild(card);
      });
    }

    analyzeBtn.addEventListener('click', analyzeFacts);
  </script>
</body>
</html>
